<!doctype html><html lang="th"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Pridi:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--bg:#f6f3f5;--surface:#fff;--ink:#251d28;--muted:#716976;--accent:#482080;--soft:#efe9fa;--ok:#137050;--warn:#a45c00;--danger:#a33747;--border:#e5dee7;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui,-apple-system,'Noto Sans Thai',sans-serif}.shell{max-width:1200px;margin:auto;padding:18px}.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin:14px 0;box-shadow:0 6px 22px #2c13300b}.login{max-width:480px;margin:10vh auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.top h1{font-size:25px;margin:0}.nav{display:flex;gap:8px;overflow:auto;padding:10px 0}.nav button,.chip{white-space:nowrap}button,input,select,textarea{font:inherit}button{border:0;border-radius:11px;background:var(--accent);color:#fff;padding:11px 14px;font-weight:700;min-height:44px;cursor:pointer}button.secondary{background:var(--soft);color:var(--accent)}button.danger{background:var(--danger)}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.metric{border:1px solid var(--border);border-radius:14px;padding:14px;background:#fff}.metric b{font-size:23px;display:block;margin-top:3px}.muted{color:var(--muted);font-size:14px}.performance{cursor:pointer}.progress{height:7px;background:#eee8f0;border-radius:10px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--accent)}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto auto;gap:8px}.filters input,.filters select,textarea{width:100%;padding:10px;border:1px solid #c9c1cb;border-radius:10px;background:white;color:var(--ink)}.booking{border-top:1px solid var(--border);padding:16px 0;display:grid;grid-template-columns:1fr auto;gap:12px}.booking:first-child{border-top:0}.booking h3{margin:0 0 5px;font-size:17px}.booking p{margin:4px 0}.actions{display:flex;gap:7px;flex-wrap:wrap;align-content:start}.badge{display:inline-block;border-radius:99px;padding:4px 9px;font-size:13px;font-weight:700;background:#f4ecdc;color:var(--warn)}.badge.ok{background:#e4f4ec;color:var(--ok)}.badge.bad{background:#fae7e9;color:var(--danger)}.warn{color:var(--warn);font-size:13px}.modal{position:fixed;inset:0;background:#160a2388;display:grid;place-items:center;padding:16px;z-index:5}.modal-box{background:white;border-radius:18px;padding:22px;max-width:680px;width:min(680px,100%);max-height:92vh;overflow:auto}.modal h2{margin-top:0}.slip{width:100%;max-height:60vh;object-fit:contain;background:#f3eff3;border-radius:12px}.error{background:#fbe8ea;color:#902a39;padding:12px;border-radius:10px}.hidden{display:none!important}footer{font-size:12px;color:var(--muted);text-align:center;padding:12px}.debug{display:none}@media(max-width:650px){.shell{padding:12px}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.booking{grid-template-columns:1fr}.actions button{flex:1}.top{align-items:flex-start}.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="shell"><section id="login" class="card login"><h1>ศูนย์จัดการบัตร PAC</h1><p class="muted">เข้าสู่ระบบสำหรับเจ้าหน้าที่</p><label>รหัสเจ้าหน้าที่<input id="token" type="password" autocomplete="current-password"></label><p><button onclick="load()">เข้าสู่ระบบ</button></p><div id="loginError"></div></section><section id="dashboard" class="hidden"><div class="top"><div><h1 id="title">ศูนย์จัดการบัตร</h1><span class="muted">ข้อมูลจาก Google Sheets แบบเรียลไทม์เมื่อกดรีเฟรช</span></div><button class="secondary" onclick="load()">รีเฟรช</button></div><nav class="nav"><button class="secondary" onclick="tab('overview')">ภาพรวม</button><button class="secondary" onclick="tab('waiting')">รอตรวจสอบ</button><button class="secondary" onclick="tab('confirmed')">ยืนยันแล้ว</button><button class="secondary" onclick="tab('closed')">ปฏิเสธ / ยกเลิก</button><button class="secondary" onclick="tab('all')">รายการทั้งหมด</button></nav><div id="view"></div></section></main><div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-box" id="modalBox"></div></div><footer><span class="debug">Build <?= buildInfo.buildId ?></span></footer>
<script>let token='',data=null,current='overview';const $=id=>document.getElementById(id),states={waiting:'WAITING_PAYMENT_REVIEW',confirmed:'CONFIRMED',closed:''},fmt=n=>Number(n||0).toLocaleString('th-TH')+' บาท';function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function badge(b){let c=b.status==='CONFIRMED'?'ok':(b.status==='REJECTED'||b.status==='CANCELLED'?'bad':'');return '<span class="badge '+c+'">'+esc(b.statusLabel)+'</span>'}function load(){token=$('token').value||token;if(!token){$('loginError').innerHTML='<p class="error">กรุณากรอกรหัสเจ้าหน้าที่</p>';return}request({})}function request(filters){$('view').innerHTML='<div class="card">กำลังโหลดข้อมูล…</div>';google.script.run.withSuccessHandler(raw=>{try{data=JSON.parse(raw);$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('title').textContent='ศูนย์จัดการบัตร · '+data.eventName;render()}catch(e){showError('ไม่สามารถอ่านข้อมูลแดชบอร์ดได้')}}).withFailureHandler(e=>showError(e.message||'เข้าสู่ระบบไม่สำเร็จ')).getAdminDataJson(token,filters)}function showError(m){$('loginError').innerHTML='<p class="error">'+esc(m)+'</p>';if(!$('dashboard').classList.contains('hidden'))$('view').innerHTML='<p class="error">'+esc(m)+'</p>'}function tab(t){current=t;request({status:states[t]||''})}function render(){let m=data.metrics;if(current==='overview')return overview(m);let filter=current==='closed'?'':states[current]||'';list(filter)}function overview(m){$('view').innerHTML='<div class="grid">'+metric('ความจุทั้งหมด',data.total+' ใบ')+metric('สำรองแล้ว',data.reserved+' ใบ')+metric('คงเหลือ',data.remaining+' ใบ')+metric('รอตรวจสอบ',m.waiting.bookings+' รายการ · '+m.waiting.tickets+' ใบ')+metric('ยืนยันแล้ว',m.confirmed.bookings+' รายการ · '+m.confirmed.tickets+' ใบ')+metric('ปฏิเสธ',m.rejected.bookings+' รายการ · '+m.rejected.tickets+' ใบ')+metric('ยกเลิก',m.cancelled.bookings+' รายการ · '+m.cancelled.tickets+' ใบ')+metric('รายได้ที่ยืนยันแล้ว',fmt(m.confirmedRevenue))+'</div><section class="card"><h2>รอบการแสดง</h2>'+data.performanceSummary.map(p=>'<article class="performance" onclick="request({performanceId:\''+esc(p.performanceId)+'\'})"><strong>'+esc(p.label)+'</strong><p class="muted">ยืนยันแล้ว '+p.confirmed+' · รอตรวจ '+p.waiting+' · สำรองรวม '+p.reserved+' / '+p.capacity+' · เหลือ '+p.remaining+'</p><div class="progress"><i style="width:'+Math.min(100,p.reserved/p.capacity*100)+'%"></i></div></article>').join('')+'</section><section class="card"><h2>งานที่ต้องตรวจสอบ</h2><p class="muted">มี '+m.waiting.bookings+' รายการรอตรวจสอบสลิป</p><button onclick="tab(\'waiting\')">เปิดคิวตรวจสอบ</button></section>'}function metric(a,b){return '<div class="metric"><span class="muted">'+a+'</span><b>'+b+'</b></div>'}function list(defaultStatus){let options='<option value="">ทุกสถานะ</option><option value="WAITING_PAYMENT_REVIEW">รอตรวจสอบสลิป</option><option value="CONFIRMED">ยืนยันแล้ว</option><option value="REJECTED">ปฏิเสธ</option><option value="CANCELLED">ยกเลิก</option>';let perf='<option value="">ทุกรอบ</option>'+data.performances.map(p=>'<option value="'+esc(p.performanceId)+'">'+esc(p.label)+'</option>').join('');$('view').innerHTML='<section class="card"><div class="filters"><input id="q" placeholder="ค้นหารหัสการจอง / ชื่อ / เบอร์โทร"><select id="status">'+options+'</select><select id="perf">'+perf+'</select><select id="sort"><option value="'+(current==='waiting'?'oldest':'newest')+'">'+(current==='waiting'?'เก่าที่สุดก่อน':'ใหม่ที่สุดก่อน')+'</option><option value="oldest">เก่าที่สุดก่อน</option><option value="name">ชื่อลูกค้า</option><option value="performance">รอบการแสดง</option></select><button onclick="apply()">ค้นหา</button><button class="secondary" onclick="request({status:\''+defaultStatus+'\'})">ล้างตัวกรอง</button></div><p class="muted">'+data.bookings.length+' รายการ</p><div id="rows">'+data.bookings.filter(b=>!defaultStatus||(defaultStatus==='CLOSED'?['REJECTED','CANCELLED'].includes(b.status):b.status===defaultStatus)).map(row).join('')+'</div></section>'}function apply(){request({query:$('q').value,status:$('status').value,performanceId:$('perf').value,sort:$('sort').value})}function row(b){return '<article class="booking"><div><h3>'+esc(b.code)+' '+badge(b)+'</h3><p><strong>'+esc(b.name)+'</strong> · '+esc(b.phone)+(b.duplicate?' <span class="warn">⚠ เบอร์นี้มีมากกว่า 1 รายการในรอบเดียวกัน</span>':'')+'</p><p>'+esc(b.performance)+' · '+b.quantity+' ใบ · '+fmt(b.total)+'</p><p class="muted">จอง: '+esc(b.created)+(b.reviewed!=='-'?' · ตรวจ: '+esc(b.reviewed):'')+'</p></div><div class="actions"><button class="secondary" onclick="detail(\''+esc(b.code)+'\')">รายละเอียด</button><button class="secondary" onclick="slip(\''+esc(b.code)+'\')">ดูสลิป</button>'+(b.status==='WAITING_PAYMENT_REVIEW'?'<button onclick="decision(\''+esc(b.code)+'\',\'CONFIRMED\')">ยืนยัน</button><button class="danger" onclick="decision(\''+esc(b.code)+'\',\'REJECTED\')">ปฏิเสธ</button>':b.status==='CONFIRMED'?'<button class="danger" onclick="decision(\''+esc(b.code)+'\',\'CANCELLED\')">ยกเลิกการจอง</button>':'')+'</div></article>'}function modal(html){$('modalBox').innerHTML=html;$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}function detail(code){google.script.run.withSuccessHandler(raw=>{let b=JSON.parse(raw);modal('<h2>'+esc(b.code)+'</h2><p>'+badge(b)+'</p><p><strong>'+esc(b.name)+'</strong><br>'+esc(b.phone)+'</p><p>'+esc(b.performance)+'<br>'+b.quantity+' ใบ · '+fmt(b.total)+'</p><p class="muted">จอง: '+esc(b.created)+'<br>ตรวจสอบ: '+esc(b.reviewed)+(b.reviewer?'<br>ผู้ตรวจ: '+esc(b.reviewer):'')+(b.note?'<br>หมายเหตุ: '+esc(b.note):'')+'</p><p><button class="secondary" onclick="closeModal()">ปิด</button></p>')}).getBookingDetailJson(token,code)}function slip(code){google.script.run.withSuccessHandler(u=>modal('<h2>สลิป '+esc(code)+'</h2><img class="slip" src="'+esc(u)+'" alt="สลิปการโอนเงิน"><p><button class="secondary" onclick="window.open(\''+esc(u)+'\',\'_blank\',\'noopener\')">เปิดใน Google Drive</button><button class="secondary" onclick="closeModal()">ปิด</button></p>')).withFailureHandler(e=>showError(e.message||'ไม่พบสลิป')).getSlipUrl(token,code)}function decision(code,to){let reject=to==='REJECTED',cancel=to==='CANCELLED',title=reject?'ปฏิเสธการชำระเงิน':cancel?'ยกเลิกการจอง':'ยืนยันการชำระเงิน';modal('<h2>'+title+'</h2><p>ยืนยันรายการ <strong>'+esc(code)+'</strong> หรือไม่</p>'+(reject||cancel?'<label>เหตุผล (ไม่บังคับ)<textarea id="note" rows="3" placeholder="เช่น ยอดเงินไม่ตรง หรือสลิปไม่ชัดเจน"></textarea></label>':'')+'<p class="actions"><button class="secondary" onclick="closeModal()">ยกเลิก</button><button class="'+(reject||cancel?'danger':'')+'" onclick="commit(\''+esc(code)+'\',\''+to+'\')">'+(reject?'ปฏิเสธ':cancel?'ยกเลิกการจอง':'ยืนยัน')+'</button></p>')}function commit(code,to){let note=$('note')?$('note').value:'';let fn=to==='CANCELLED'?'cancelBooking':'reviewBooking';google.script.run.withSuccessHandler(()=>{closeModal();tab(current)}).withFailureHandler(e=>showError(e.message||'ทำรายการไม่สำเร็จ'))[fn](token,code,to==='CANCELLED'?note:to,to==='CANCELLED'?undefined:note)}$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});
</script></body></html>
