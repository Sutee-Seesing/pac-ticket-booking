<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:16px system-ui;margin:auto;max-width:1000px;padding:20px;background:#f7f6fb;color:#1d1b24}.card{background:#fff;padding:16px;border-radius:12px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.metric{padding:14px;background:#eee5ff;border-radius:10px}.booking{border-top:1px solid #ddd;padding:14px 0}button,input{font:inherit;padding:10px;border-radius:7px;border:1px solid #aaa}button{background:#351c75;color:#fff;border:0;margin:4px}.error{color:#a00}footer{font-size:12px;color:#625b70;text-align:center;padding:12px}</style></head><body><h1>Ticket staff dashboard</h1><div id="login" class="card"><label>Admin access token <input id="token" type="password"></label><button onclick="load()">Open dashboard</button><p>Set <code>ADMIN_TOKEN</code> in Apps Script Script Properties; do not share it.</p></div><div id="app"></div><footer>Build <?= buildInfo.buildId ?></footer><script>console.info('[PAC admin] build <?= buildInfo.buildId ?>');
let token='';const f=n=>Number(n).toLocaleString('en-US')+' THB';const app=document.getElementById('app');function showError(message){app.innerHTML='<p class="error">'+message+'</p>'}function load(){token=document.getElementById('token').value;app.textContent='Loading dashboard…';google.script.run.withSuccessHandler(raw=>{try{if(typeof raw!=='string'||!raw)throw new Error('Dashboard response is missing.');render(JSON.parse(raw));}catch(e){showError('Unable to load dashboard: '+e.message)}}).withFailureHandler(e=>showError(e&&e.message||'Admin request failed.')).getAdminDashboardJson(token)}function render(d){if(!d||!Array.isArray(d.performances)||!Array.isArray(d.queue))return showError('Unable to load dashboard: invalid dashboard response.');document.getElementById('login').style.display='none';let per=d.performances.map(p=>`<li>${p.date} · ${p.start_time} — ${p.capacity-p.remaining} / ${p.capacity} reserved — ${p.remaining} remaining</li>`).join('');let q=d.queue.map(b=>`<div class="booking"><strong>${b.code}</strong> — ${b.name} (${b.phone})<br>${b.performance} · ${b.quantity} ticket(s) · ${f(b.total)}<br>Submitted: ${b.created}<br><button onclick="slip('${b.code}')">View slip</button><button onclick="review('${b.code}','CONFIRMED')">Confirm payment</button><button onclick="review('${b.code}','REJECTED')">Reject payment</button></div>`).join('')||'<p>No payments waiting for review.</p>';app.innerHTML=`<div class="grid"><div class="metric">Capacity<br><b>${d.total}</b></div><div class="metric">Reserved / sold<br><b>${d.reserved}</b></div><div class="metric">Remaining<br><b>${d.total-d.reserved}</b></div><div class="metric">Waiting review<br><b>${d.waiting}</b></div><div class="metric">Confirmed<br><b>${d.confirmed}</b></div><div class="metric">Rejected<br><b>${d.rejected}</b></div></div><div class="card"><h2>Performances</h2><ul>${per}</ul></div><div class="card"><h2>${d.queue.length} payments waiting for review</h2>${q}</div>`}function review(c,d){let note=d==='REJECTED'?prompt('Optional rejection note:')||'':'';if(!confirm((d==='CONFIRMED'?'Confirm':'Reject')+' payment for '+c+'?'))return;google.script.run.withSuccessHandler(load).withFailureHandler(e=>alert(e.message)).reviewBooking(token,c,d,note)}function slip(c){google.script.run.withSuccessHandler(u=>window.open(u,'_blank','noopener')).withFailureHandler(e=>alert(e.message)).getSlipUrl(token,c)}</script></body></html>
