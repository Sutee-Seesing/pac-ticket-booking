function summary(){let q=Number($('quantity').value)||0,price=pricePreview(q);$('summary').innerHTML='<span>รอบ '+thai(selected)+'</span><br><span>จำนวน '+q+' ใบ</span><small>'+price.copy+'</small><strong>ยอดชำระ '+fmt(price.total)+'</strong>'}function goPayment(){let q=Number($('quantity').value),price=pricePreview(q),name=$('name').value.trim(),phone=$('phone').value.trim();if(!name)return notice('กรุณากรอกชื่อ-นามสกุล','error');if(!phone)return notice('กรุณากรอกเบอร์โทรศัพท์','error');if(!Number.isInteger(q)||q<1||q>selected.remaining)return notice('จำนวนบัตรต้องอยู่ระหว่าง 1 ถึง '+selected.remaining+' ใบ','error');$('payment').innerHTML='<strong>'+esc(cfg.bankName)+'</strong><br>ชื่อบัญชี: '+esc(cfg.accountHolder)+'<br>เลขบัญชี: <strong>'+esc(cfg.accountNumber)+'</strong><br><span class="muted">'+thai(selected)+' · '+q+' ใบ<br>'+price.copy+'</span>';$('paymentTotal').textContent='โอน '+fmt(price.total)+' (ระบบยืนยันราคาตามเวลาที่ส่งข้อมูล)';$('step3').classList.remove('hidden');setStep(3);$('step3').scrollIntoView({behavior:'smooth'})}
</script><script>(function(){function attachPromptpayQr(){if(!window.cfg||!cfg.promptpayQr||document.getElementById('promptpayQr'))return;var parent=document.querySelector('#step3 .summary');if(!parent)return;var figure=document.createElement('figure');figure.id='promptpayQr';figure.className='promptpay-qr visible';figure.innerHTML='<img src="'+esc(cfg.promptpayQr)+'" alt="PromptPay QR"><figcaption>สแกน QR พร้อมเพย์เพื่อชำระเงิน</figcaption>';parent.appendChild(figure)}setInterval(attachPromptpayQr,250)})();</script></body></html>
