<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{font:16px system-ui,sans-serif;margin:0;background:#f7f6fb;color:#1d1b24}.wrap{max-width:680px;margin:auto;padding:20px}header{background:#351c75;color:#fff;padding:28px;border-radius:0 0 24px 24px}h1{margin:0;font-size:28px}.card{background:#fff;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 2px 12px #0001}.show{width:100%;text-align:left;margin:8px 0;padding:14px;border:2px solid #ddd;border-radius:12px;background:#fff;font:inherit}.show.selected{border-color:#351c75;background:#f2edff}.sold{opacity:.55}label{display:block;margin-top:12px;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;margin-top:5px;border:1px solid #aaa;border-radius:8px;font:inherit}button{padding:13px 16px;border:0;border-radius:9px;background:#351c75;color:white;font-weight:700;font:inherit;margin-top:16px;min-height:48px}button:disabled{opacity:.5}small,.muted{color:#625b70}.hidden{display:none}.notice{padding:12px;border-radius:8px;background:#eee5ff}.error{background:#ffe9e8;color:#8b1e1e}.total{font-size:20px;font-weight:800}.row{display:flex;justify-content:space-between;gap:10px}@media(max-width:480px){.wrap{padding:12px}}
</style></head><body><header><div class="wrap"><h1 id="event">PAC Performance 2026</h1><div id="desc"></div></div></header><main class="wrap"><div id="message" role="alert"></div>
<section class="card" id="step1"><h2>1. Choose a performance</h2><div id="shows">Loading performances…</div></section>
<section class="card hidden" id="step2"><h2>2. Booking information</h2><label>Full name<input id="name" autocomplete="name" required></label><label>Phone number<input id="phone" type="tel" autocomplete="tel" required></label><label>Number of tickets<input id="quantity" type="number" min="1" step="1" value="1"></label><p class="total" id="total"></p><button onclick="goPayment()">Continue to payment</button></section>
<section class="card hidden" id="step3"><h2>3. Payment</h2><div id="payment" class="notice"></div><label>Upload payment slip (JPEG, PNG, or WEBP; max 5 MB)<input id="slip" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="muted" id="fileName"></p><button id="submit" onclick="submitBooking()">Submit booking</button></section>
<section class="card"><h2>Check booking status</h2><label>Booking ID<input id="lookupCode"></label><label>Phone number<input id="lookupPhone" type="tel"></label><button onclick="lookup()">Check status</button><div id="lookupResult"></div></section></main>
<script>
let cfg, selected, slipData; const $=id=>document.getElementById(id); const fmt=n=>Number(n).toLocaleString('en-US')+' THB';
function loadConfig(){if(!(window.google&&google.script&&google.script.run)){setTimeout(loadConfig,250);return}google.script.run.withSuccessHandler(init).withFailureHandler(error).getPublicConfig()}
setTimeout(loadConfig,500);
function init(data){cfg=data;$('event').textContent=data.eventName;$('desc').textContent=data.description||'';$('shows').innerHTML='';data.performances.forEach(p=>{let b=document.createElement('button');b.className='show '+(!p.available?'sold':'');b.disabled=!p.available;b.innerHTML=`<div class="row"><strong>${pretty(p)}</strong><strong>${p.available?p.remaining+' / '+p.capacity+' tickets remaining':'SOLD OUT'}</strong></div><small>${fmt(data.ticketPrice)} each</small>`;b.onclick=()=>choose(p,b);$('shows').appendChild(b)});$('quantity').oninput=updateTotal;$('slip').onchange=readSlip;}
function pretty(p){return new Date(p.date+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})+' · '+p.start_time}
function choose(p,b){selected=p;document.querySelectorAll('.show').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');$('step2').classList.remove('hidden');updateTotal();scrollTo({top:$('step2').offsetTop,behavior:'smooth'});}
function updateTotal(){let q=+$('quantity').value||0;$('total').textContent=fmt(cfg.ticketPrice)+' × '+q+' tickets = '+fmt(cfg.ticketPrice*q)}
function goPayment(){let q=+$('quantity').value;if(!$('name').value.trim()||!$('phone').value.trim())return error('Enter your full name and phone number.');if(!Number.isInteger(q)||q<1||q>selected.remaining)return error('Choose a whole number from 1 to '+selected.remaining+'.');$('payment').innerHTML=`<strong>${cfg.bankName}</strong><br>Account: ${cfg.accountNumber}<br>Account holder: ${cfg.accountHolder}<hr>Transfer <strong>${fmt(cfg.ticketPrice*q)}</strong><br>${pretty(selected)} · ${q} ticket(s)`;$('step3').classList.remove('hidden');scrollTo({top:$('step3').offsetTop,behavior:'smooth'});}
function readSlip(e){let f=e.target.files[0];slipData=null;if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5242880){e.target.value='';return error('Use a JPEG, PNG, or WEBP image no larger than 5 MB.')}let r=new FileReader;r.onload=()=>{slipData={base64:r.result.split(',')[1],mimeType:f.type,size:f.size};$('fileName').textContent='Selected: '+f.name};r.readAsDataURL(f)}
function submitBooking(){if(!slipData)return error('Please upload your payment slip.');let btn=$('submit');btn.disabled=true;btn.textContent='Submitting…';google.script.run.withSuccessHandler(r=>{document.querySelectorAll('main .card').forEach(x=>x.classList.add('hidden'));$('message').className='card notice';$('message').innerHTML=`<h2>Booking received</h2><p>Booking ID: <strong>${r.bookingCode}</strong> <button onclick="navigator.clipboard.writeText('${r.bookingCode}')">Copy</button></p><p>${r.performance}<br>${r.quantity} ticket(s) · ${fmt(r.total)}</p><p>Your tickets are reserved while the payment slip is reviewed.</p>`;}).withFailureHandler(e=>{btn.disabled=false;btn.textContent='Submit booking';error(e.message)}).submitBooking({requestId:crypto.randomUUID().replace(/-/g,''),performanceId:selected.performance_id,name:$('name').value,phone:$('phone').value,quantity:$('quantity').value,slip:slipData});}
function lookup(){google.script.run.withSuccessHandler(r=>$('lookupResult').innerHTML=`<p class="notice"><strong>${r.code}</strong><br>${r.performance}<br>${r.quantity} ticket(s) · ${fmt(r.total)}<br>Status: ${r.status}</p>`).withFailureHandler(e=>error(e.message)).lookupBooking($('lookupCode').value,$('lookupPhone').value)}function error(m){$('message').className='card error';$('message').textContent=m;scrollTo({top:0,behavior:'smooth'})}
</script></body></html>
